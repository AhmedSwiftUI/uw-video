<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>نظام الأعمال الموحد · عرض توضيحي</title>
<style>
  html,body{margin:0;height:100%;background:#000}
  body{display:flex;align-items:center;justify-content:center}
  video{width:100%;height:100%;max-height:100svh;object-fit:contain;background:#000;display:block}
</style>
</head>
<body>
<video src="demo.mp4" poster="demo.jpg" autoplay muted loop playsinline controls preload="auto"></video>
<script>
  const v=document.querySelector('video');
  const go=()=>v.play().catch(()=>{});
  go();document.addEventListener('visibilitychange',()=>{if(!document.hidden)go()});
  document.addEventListener('touchstart',go,{once:true});
</script>
</body>
</html>
