<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>نظام الأعمال الموحد · فيديو التجربة الميدانية</title>
<style>
  html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,"IBM Plex Sans Arabic",sans-serif}
  body{display:flex;flex-direction:column;min-height:100svh}
  header{padding:12px 16px 8px;text-align:center;background:#0E3F3C}
  header b{display:block;font-size:17px;font-weight:600}
  header span{display:block;font-size:12.5px;color:#BFD9D3;margin-top:3px}
  main{flex:1;display:flex;align-items:center;justify-content:center;position:relative;background:#000}
  video{width:100%;max-height:100svh;display:block;background:#000}
  #tap{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.35);cursor:pointer;-webkit-tap-highlight-color:transparent}
  #tap div{background:#fff;color:#0E3F3C;border-radius:999px;padding:14px 26px;font-size:17px;font-weight:700;display:flex;align-items:center;gap:10px;box-shadow:0 6px 24px rgba(0,0,0,.4)}
  #tap svg{width:22px;height:22px}
  #tap.hide{display:none}
  footer{padding:10px 14px;font-size:12.5px;color:#BFD9D3;text-align:center;background:#0E3F3C}
  footer a{color:#7ED3C1;text-decoration:none}
</style>
</head>
<body>
<header><b>نظام الأعمال الموحد · التجربة الميدانية</b><span>تدقيق المستندات والمراقبة الميدانية لدى شركة كهرباء · نحو ٤ دقائق</span></header>
<main>
  <video id="v" src="field-trial.mp4" playsinline autoplay muted controls preload="auto" poster="field-trial.jpg"></video>
  <div id="tap"><div><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></svg>اضغط لتشغيل الصوت</div></div>
</main>
<footer><a href="https://uw.81-208-191-204.sslip.io/">المنصة</a> · <a href="https://uw.81-208-191-204.sslip.io/status">الحالة والدقة</a></footer>
<script>
  var v=document.getElementById('v'),t=document.getElementById('tap');
  function go(){v.muted=false;v.volume=1;var p=v.play();if(p&&p.catch)p.catch(function(){});t.classList.add('hide');}
  t.addEventListener('click',go);
  v.addEventListener('play',function(){if(!v.muted)t.classList.add('hide');});
  // لو سمح المتصفح بالتشغيل بالصوت مباشرة فلا حاجة للزر
  var tryLoud=v.play();
  if(tryLoud&&tryLoud.then){tryLoud.then(function(){/* muted autoplay ok */}).catch(function(){});}
  document.addEventListener('visibilitychange',function(){if(document.hidden)v.pause();});
</script>
</body>
</html>
